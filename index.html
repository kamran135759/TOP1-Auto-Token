
<section class="card">
  <h2>Contract Generator</h2>

  <label for="tokenName">Token Name</label>
  <input id="tokenName" value="TOP1">

  <label for="tokenSymbol">Token Symbol</label>
  <input id="tokenSymbol" value="TOP1">

  <label for="tokenDecimals">Decimals</label>
  <input id="tokenDecimals" type="number" min="0" max="18" value="18">

  <label for="tokenSupply">Total Supply</label>
  <input id="tokenSupply" type="number" min="1" step="1" value="1000000">

  <button id="generateContractBtn">GENERATE CONTRACT</button>
  <button id="saveContractBtn" class="secondary">SAVE SOLIDITY FILE</button>
  <button id="copyContractBtn" class="secondary">COPY CONTRACT CODE</button>

  <p id="generateStatus" class="status">
    Configure your token, then generate a Solidity contract.
  </p>

  <pre id="generatedContractCode" style="white-space:pre;overflow:auto;max-height:400px"></pre>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let currentContractCode = "";

  function makeContract() {
    const name = $("tokenName").value.trim();
    const symbol = $("tokenSymbol").value.trim();
    const decimalsText = $("tokenDecimals").value.trim();
    const supplyText = $("tokenSupply").value.trim();

    if (!name || !symbol) {
      throw new Error("Enter a token name and symbol.");
    }

    if (!/^[A-Za-z0-9 ]+$/.test(name) ||
        !/^[A-Za-z0-9]+$/.test(symbol)) {
      throw new Error("Use English letters and numbers for name and symbol.");
    }

    if (!/^\d+$/.test(decimalsText) ||
        Number(decimalsText) < 0 ||
        Number(decimalsText) > 18) {
      throw new Error("Decimals must be an integer from 0 to 18.");
    }

    if (!/^\d+$/.test(supplyText) ||
        BigInt(supplyText) < 1n ||
        BigInt(supplyText) > 1000000000000000000n) {
      throw new Error("Enter a valid whole-number supply.");
    }

    const decimals = Number(decimalsText);
    const supply = BigInt(supplyText);
    const rawSupply = supply * (10n ** BigInt(decimals));

    return `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

contract TOP1GeneratedToken {
    string public constant name = "${name}";
    string public constant symbol = "${symbol}";
    uint8 public constant decimals = ${decimals};
    uint256 public constant totalSupply = ${rawSupply};

    mapping(address => uint256) public balanceOf;
    mapping(address => mapping(address => uint256)) public allowance;

    event Transfer(address indexed from, address indexed to, uint256 value);
    event Approval(address indexed owner, address indexed spender, uint256 value);

    constructor() {
        balanceOf[msg.sender] = totalSupply;
        emit Transfer(address(0), msg.sender, totalSupply);
    }

    function transfer(address to, uint256 value) external returns (bool) {
        require(to != address(0), "Invalid recipient");
        require(balanceOf[msg.sender] >= value, "Insufficient balance");
        balanceOf[msg.sender] -= value;
        balanceOf[to] += value;
        emit Transfer(msg.sender, to, value);
        return true;
    }

    function approve(address spender, uint256 value) external returns (bool) {
        require(spender != address(0), "Invalid spender");
        allowance[msg.sender][spender] = value;
        emit Approval(msg.sender, spender, value);
        return true;
    }

    function transferFrom(address from, address to, uint256 value) external returns (bool) {
        require(from != address(0) && to != address(0), "Invalid address");
        require(balanceOf[from] >= value, "Insufficient balance");
        require(allowance[from][msg.sender] >= value, "Allowance exceeded");
        allowance[from][msg.sender] -= value;
        balanceOf[from] -= value;
        balanceOf[to] += value;
        emit Transfer(from, to, value);
        return true;
    }
}`;
  }

  $("generateContractBtn").addEventListener("click", () => {
    try {
      currentContractCode = makeContract();
      $("generatedContractCode").textContent = currentContractCode;
      $("generateStatus").textContent =
        "Contract generated. Save the .sol file, then compile and deploy it in Remix.";
    } catch (error) {
      $("generateStatus").textContent = "Error: " + error.message;
    }
  });

  $("saveContractBtn").addEventListener("click", () => {
    if (!currentContractCode) {
      $("generateStatus").textContent = "Generate the contract first.";
      return;
    }

    const blob = new Blob([currentContractCode], {
      type: "text/plain;charset=utf-8"
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "TOP1GeneratedToken.sol";
    link.click();
    URL.revokeObjectURL(url);
    $("generateStatus").textContent = "Download requested for TOP1GeneratedToken.sol.";
  });

  $("copyContractBtn").addEventListener("click", async () => {
    if (!currentContractCode) {
      $("generateStatus").textContent = "Generate the contract first.";
      return;
    }

    try {
      await navigator.clipboard.writeText(currentContractCode);
      $("generateStatus").textContent = "Contract code copied.";
    } catch (_) {
      $("generateStatus").textContent =
        "Clipboard access is unavailable. Use SAVE SOLIDITY FILE.";
    }
  });
})();
    </script>
